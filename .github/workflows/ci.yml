name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e .
      - name: test
        run: python -m unittest discover -s tests -v
      - name: smoke test the CLI
        run: |
          embodigen gen --task "把红色方块放进盒子" --out out --resolution 48
          embodigen validate --episode out/episodes/franka-0000
          embodigen gen --task "put the blue cube in the bin" --out out --resolution 32 --episodes 3 --seed 10
          embodigen index --out out
          embodigen preview --episode out/episodes/franka-0000 --max-frames 6
