# D2E-480p titles (open-world-agents/D2E-480p; one folder per game). The D2E
# adapter labels a folder by these names; Minecraft_1.21.8 resolves to the
# anchor world in minecraft.toml. Category/view/franchise are our assignment
# (GameScaling's taxonomy: AVG STG RPG RAC SIM OTH), not D2E's.
#
# mouse_scale: D2E logs raw HID counts at ~1 kHz. Measured on
# recording_20250820_212408 (Counter-Strike 2): 3.2% of 200 ms packets hit the
# +-1000 clip at scale 1.0, 0.0-0.1% for the other sampled games. Re-measure
# with `embodigen ledger <curated>` (column "clip") before trusting a scale.

