[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodigen"
version = "0.3.0"
description = "Label-exact training data for embodied agents: robot episodes and virtual-world gameplay."
readme = "README.md"
requires-python = ">=3.11"  # tomllib for the robot configs
license = { text = "TBD" }
authors = [{ name = "EmbodiGen contributors" }]
keywords = ["embodied-ai", "robot-learning", "synthetic-data", "sim2real", "lerobot", "virtual-worlds", "gameplay", "vizdoom", "minecraft"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core pipeline is standard-library only on purpose: clone, run, inspect.
# Heavy backends stay optional so the contract can be exercised without a GPU.
dependencies = []

[project.optional-dependencies]
sim = ["mani-skill>=3.0.0", "sapien>=3.0.0", "torch>=2.1"]
photoreal = ["torch>=2.1", "diffusers>=0.27", "transformers>=4.38"]
lerobot = ["pyarrow>=14", "pillow>=10"]
env = ["vizdoom>=1.2.3"]
# zstd-compressed MCAP chunks (D2E); Python 3.14+ reads them with the standard library.
d2e = ["zstandard>=0.22; python_version < '3.14'"]
# Decode frames kept inside videos (D2E .mkv, P2P/VPT .mp4) for the alignment check.
video = ["av>=12"]
dev = ["pytest>=8"]

[project.scripts]
embodigen = "embodigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"embodigen.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
